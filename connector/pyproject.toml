[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowsteward-toolbox-dataset-connector-extension"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "packaged: needs this package's Toolbox binaries; runs inside each rendered variant",
    "variant_contract: what this package offers matches its variant",
]

