$schema: https://json-schema.org/draft/2020-12/schema
title: Google MCP Toolbox Dataset Connector Configuration
type: object
additionalProperties: false
required:
  - prebuilt
properties:
  prebuilt:
    type: string
    enum:
      - alloydb-omni
      - alloydb-postgres
      - clickhouse
      - cloud-sql-mssql
      - cloud-sql-mysql
      - cloud-sql-postgres
      - mariadb
      - mssql
      - mysql
      - oceanbase
      - postgres
      - singlestore
      - snowflake
      - spanner
      - spanner-postgres
      - sqlite
    description: Google MCP Toolbox prebuilt connector to invoke.
  database:
    type: string
    description: Database name for the selected external source.
  host:
    type: string
    description: Database host for networked Toolbox prebuilts.
  port:
    type: string
    description: Database port for networked Toolbox prebuilts.
  user:
    type: string
    description: Database user for networked Toolbox prebuilts.
  query_params:
    type: string
    description: Optional PostgreSQL query params passed to Toolbox.
  account:
    type: string
    description: Account identifier for account-scoped sources such as Snowflake.
  project:
    type: string
    description: Cloud project for managed Google Cloud sources.
  region:
    type: string
    description: Cloud region for managed Google Cloud sources.
  cluster:
    type: string
    description: Cluster identifier for managed database sources.
  instance:
    type: string
    description: Instance identifier for managed database sources.
  ip_type:
    type: string
    description: Public or private IP mode for managed database sources.
  protocol:
    type: string
    description: Source protocol, such as native or http for ClickHouse.
  schema:
    type: string
    description: Default database schema.
  warehouse:
    type: string
    description: Compute warehouse for Snowflake.
  role:
    type: string
    description: Database role for Snowflake.
  dialect:
    type: string
    description: SQL dialect for Spanner.
  env:
    type: object
    additionalProperties:
      type: string
    description: Optional explicit Toolbox environment variables.

# Conditional requirements, declared rather than assumed.
#
# `prebuilt` alone was the only required field, so a PostgreSQL connection with
# no host, database or user installed cleanly and failed at use. The sixteen
# prebuilts fall into five shapes, and each one names what its operator must
# supply. Everything absent from these lists stays optional on purpose - port,
# query_params, protocol, ip_type, schema, warehouse, role and dialect all have
# working defaults, and no password is required because Cloud SQL and AlloyDB
# authenticate through IAM.
#
# This is expressed in JSON Schema, not in platform code, because this connector
# is the worked example third-party extension authors copy. Teaching them that
# database knowledge belongs in Python would be the wrong lesson.
allOf:
  # Networked, host-addressed sources.
  - if:
      properties:
        prebuilt:
          enum:
            - alloydb-omni
            - clickhouse
            - mariadb
            - mssql
            - mysql
            - oceanbase
            - postgres
            - singlestore
      required: [prebuilt]
    then:
      required: [host, database, user]
  # Google Cloud managed instances, addressed by project/region/instance.
  - if:
      properties:
        prebuilt:
          enum:
            - cloud-sql-mssql
            - cloud-sql-mysql
            - cloud-sql-postgres
      required: [prebuilt]
    then:
      required: [project, region, instance, database, user]
  # AlloyDB for PostgreSQL adds a cluster to the managed shape.
  - if:
      properties:
        prebuilt:
          const: alloydb-postgres
      required: [prebuilt]
    then:
      required: [project, region, cluster, instance, database, user]
  # Snowflake is account-scoped rather than host-addressed.
  - if:
      properties:
        prebuilt:
          const: snowflake
      required: [prebuilt]
    then:
      required: [account, user, database]
  # Spanner is addressed by project and instance, with no user.
  - if:
      properties:
        prebuilt:
          enum: [spanner, spanner-postgres]
      required: [prebuilt]
    then:
      required: [project, instance, database]
  # SQLite is a file path and nothing else.
  - if:
      properties:
        prebuilt:
          const: sqlite
      required: [prebuilt]
    then:
      required: [database]
