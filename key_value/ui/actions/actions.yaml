actions:
- action_id: get
  workflow_visible: true
  title: Get
  description: Read a text value. Missing keys return null with found false; empty
    strings remain found.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: string
    required: true
  - name: key
    type: string
    required: true
  result_fields:
  - result.value
  - result.found
  - result.applied
  - result.key
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - provider_unavailable
  - native_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  - timeout
  - wrong_type
  - uncertain_write
  mutates_platform: false
- action_id: set
  workflow_visible: true
  title: Set
  description: Atomically set a text value with optional TTL and NX or XX condition.
    An unmet condition returns applied false and value null.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: string
    required: true
  - name: key
    type: string
    required: true
  - name: value
    type: string
    required: true
  - name: ttl_seconds
    type: integer
    required: false
  - name: condition
    type: string
    required: false
  result_fields:
  - result.value
  - result.found
  - result.applied
  - result.key
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - provider_unavailable
  - native_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  - timeout
  - wrong_type
  - uncertain_write
  mutates_platform: false
