- operation_id: hash_set
  display_name: Hash set
  description: Set up to 64 hash fields. Returns the number of newly added fields.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - redis
  - valkey
  category: data
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Connection ref
  - name: key
    value_type: text
    required: true
    display_name: Key
    schema:
      type: string
      minLength: 1
      maxLength: 256
  - name: fields
    value_type: object
    required: true
    display_name: Fields
    schema:
      type: object
      additionalProperties:
        type: string
        maxLength: 65536
      not:
        const: {}
      description: 1–64 fields; nonempty field names at most 256 UTF-8 bytes. Runtime
        enforces field count and byte bounds.
  outputs:
  - name: value
    value_type: json
  - name: found
    value_type: boolean
  - name: applied
    value_type: boolean
  - name: key
    value_type: text
  result_fields:
  - result.value
  - result.found
  - result.applied
  - result.key
  error_codes:
