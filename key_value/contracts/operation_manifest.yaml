operations:
- operation_id: get
  display_name: Get
  description: Read a text value. Missing keys return null with found false; empty
    strings remain found.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - redis
  - valkey
  category: data
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Connection ref
  - name: key
    value_type: text
    required: true
    display_name: Key
    schema:
      type: string
      minLength: 1
      maxLength: 256
  outputs:
  - name: value
    value_type: json
  - name: found
    value_type: boolean
  - name: applied
    value_type: boolean
  - name: key
    value_type: text
  result_fields:
  - result.value
  - result.found
  - result.applied
  - result.key
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - provider_unavailable
  - native_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  - timeout
  - wrong_type
  - uncertain_write
- operation_id: set
  display_name: Set
  description: Atomically set a text value with optional TTL and NX or XX condition.
    An unmet condition returns applied false and value null.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - redis
  - valkey
  category: data
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Connection ref
  - name: key
    value_type: text
    required: true
    display_name: Key
    schema:
      type: string
      minLength: 1
      maxLength: 256
  - name: value
    value_type: text
    required: true
    display_name: Value
    schema:
      type: string
      maxLength: 65536
  - name: ttl_seconds
    value_type: integer
    required: false
    display_name: Ttl seconds
    schema:
      type: integer
      minimum: 1
      maximum: 2147483647
  - name: condition
    value_type: text
    required: false
    display_name: Condition
    schema:
      type: string
      enum:
      - always
      - nx
      - xx
      default: always
  outputs:
  - name: value
    value_type: json
  - name: found
    value_type: boolean
  - name: applied
    value_type: boolean
  - name: key
    value_type: text
  result_fields:
  - result.value
  - result.found
  - result.applied
  - result.key
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - provider_unavailable
  - native_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  - timeout
  - wrong_type
  - uncertain_write
