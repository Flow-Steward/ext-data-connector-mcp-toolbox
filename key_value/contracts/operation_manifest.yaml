      type: string
      minLength: 1
      maxLength: 256
  - name: values
    value_type: array
    required: true
    display_name: Values
    schema:
      type: array
      minItems: 1
      maxItems: 64
      items:
        type: string
        maxLength: 65536
  - name: direction
    value_type: text
    required: false
    display_name: Direction
    schema:
      type: string
      enum:
      - left
